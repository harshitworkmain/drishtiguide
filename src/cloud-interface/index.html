<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardian | Smart Stick Monitor</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; }
        #map { height: 450px; width: 100%; border-radius: 1.5rem; z-index: 1; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .emergency-glow { box-shadow: 0 0 50px rgba(239, 68, 68, 0.4); border: 2px solid #ef4444; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
    </style>
</head>
<body class="text-slate-200 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto space-y-6">
        
        <header class="flex flex-col md:flex-row justify-between items-center glass p-6 rounded-3xl gap-4">
            <div class="flex items-center gap-4">
                <div class="bg-indigo-600 p-3 rounded-2xl shadow-lg shadow-indigo-500/30">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A2 2 0 013 15.382V6m18 13h-6m0 0l-1.586-1.586a2 2 0 010-2.828l1.586-1.586m0 6V10m6 11H9" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight">Guardian <span class="text-indigo-400">Stick</span></h1>
                    <p class="text-slate-400 text-sm font-medium" id="sync-text">Establishing cloud connection...</p>
                </div>
            </div>
            
            <div id="status-card" class="bg-slate-800/50 px-6 py-3 rounded-2xl flex items-center">
                <span id="dot" class="status-dot bg-green-500 animate-pulse"></span>
                <span id="status-text" class="text-sm font-bold uppercase tracking-wider text-green-400">Device Online</span>
            </div>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <div class="lg:col-span-2 glass rounded-[2rem] overflow-hidden p-2" id="map-container">
                <div id="map"></div>
            </div>

            <div class="space-y-6">
                <div class="glass p-6 rounded-[2rem] space-y-4">
                    <h3 class="text-slate-400 text-xs font-bold uppercase tracking-widest">Live Coordinates</h3>
                    <div class="space-y-3">
                        <div class="flex justify-between items-center bg-slate-900/50 p-4 rounded-2xl">
                            <span class="text-slate-500 font-semibold">Latitude</span>
                            <span id="lat" class="font-mono text-indigo-400 font-bold text-lg">0.000000</span>
                        </div>
                        <div class="flex justify-between items-center bg-slate-900/50 p-4 rounded-2xl">
                            <span class="text-slate-500 font-semibold">Longitude</span>
                            <span id="lng" class="font-mono text-indigo-400 font-bold text-lg">0.000000</span>
                        </div>
                    </div>
                </div>

                <div class="glass p-6 rounded-[2rem] space-y-4 border-l-4 border-indigo-500">
                    <h3 class="text-slate-400 text-xs font-bold uppercase tracking-widest text-center">Emergency Status</h3>
                    <div class="text-center py-4">
                        <div id="fall-time" class="text-3xl font-black text-white">NONE</div>
                        <p class="text-slate-500 text-xs mt-1 uppercase font-bold tracking-tighter">Last Fall Timestamp</p>
                    </div>
                    
                    <button id="reset-btn" onclick="resetEmergency()" class="hidden w-full bg-red-500 hover:bg-red-600 text-white font-extrabold py-4 rounded-2xl transition-all shadow-xl shadow-red-500/20 active:scale-95">
                        RESOLVE EMERGENCY
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Firebase Config
        const firebaseConfig = {
            databaseURL: "https://stick-ff202-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 2. Map Setup with Dark Mode Tiles
        let map = L.map('map', { zoomControl: false }).setView([12.8406, 80.1534], 16);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        }).addTo(map);
        
        // Custom Marker
        let marker = L.circleMarker([12.8406, 80.1534], {
            radius: 12,
            fillColor: "#6366f1",
            color: "#fff",
            weight: 3,
            opacity: 1,
            fillOpacity: 0.8
        }).addTo(map);

        // 3. Realtime Listener
        db.ref('stick').on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            // Updates UI
            if (data.latitude !== undefined) {
                document.getElementById('lat').innerText = Number(data.latitude).toFixed(6);
            }
            if (data.longitude !== undefined) {
                document.getElementById('lng').innerText = Number(data.longitude).toFixed(6);
            }
            document.getElementById('fall-time').innerText = data.lastFallTime || "NONE";
            document.getElementById('sync-text').innerText = "Live: Synchronized with stick";

            // Map Logic
            if (data.latitude !== undefined && data.longitude !== undefined) {
                const pos = [Number(data.latitude), Number(data.longitude)];
                marker.setLatLng(pos);
                map.panTo(pos);
            }

            // Emergency Logic
            const mapContainer = document.getElementById('map-container');
            const statusText = document.getElementById('status-text');
            const dot = document.getElementById('dot');
            const resetBtn = document.getElementById('reset-btn');

            if (data.fallDetected === true) {
                mapContainer.classList.add('emergency-glow');
                statusText.innerText = "🚨 EMERGENCY: FALL DETECTED";
                statusText.className = "text-sm font-bold uppercase tracking-wider text-red-500";
                dot.className = "status-dot bg-red-500 animate-ping";
                resetBtn.classList.remove('hidden');
            } else {
                mapContainer.classList.remove('emergency-glow');
                statusText.innerText = "Device Online";
                statusText.className = "text-sm font-bold uppercase tracking-wider text-green-400";
                dot.className = "status-dot bg-green-500 animate-pulse";
                resetBtn.classList.add('hidden');
            }
        });

        function resetEmergency() {
            db.ref('stick').update({ fallDetected: false });
        }
    </script>
</body>
</html>
