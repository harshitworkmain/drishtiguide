name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v2
      
    - name: Install platform
      run: |
        arduino-cli core update-index --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json,https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
        arduino-cli core install esp8266:esp8266 --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
        arduino-cli core install esp32:esp32 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
        
    - name: Install libraries
      run: |
        arduino-cli lib install "TinyGPSPlus"
        arduino-cli lib install "MPU6050"
    
    - name: Lint code
      run: |
        find src -name "*.ino" -o -name "*.h" -o -name "*.cpp" | xargs -I {} echo "Checking {}"
        # Basic syntax checking
        arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 src/esp8266-nodes/transmitter/
        arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 src/esp8266-nodes/receiver/
        arduino-cli compile --fqbn esp32:esp32:esp32doit-devkit-v1 src/esp32-main-controller/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Run unit tests
      run: |
        python -m pytest tests/unit_tests/ -v --cov=src
    
    - name: Run integration tests
      run: |
        python -m pytest tests/integration_tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        board: 
          - esp8266:esp8266:nodemcuv2
          - esp32:esp32:esp32doit-devkit-v1
        sketch:
          - src/esp8266-nodes/transmitter/
          - src/esp8266-nodes/receiver/
          - src/esp32-main-controller/
        exclude:
          - board: esp32:esp32:esp32doit-devkit-v1
            sketch: src/esp8266-nodes/transmitter/
          - board: esp32:esp32:esp32doit-devkit-v1
            sketch: src/esp8266-nodes/receiver/
          - board: esp8266:esp8266:nodemcuv2
            sketch: src/esp32-main-controller/
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v2
      
    - name: Install platform
      run: |
        arduino-cli core update-index --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json,https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
        CORE=$(echo ${{ matrix.board }} | cut -d':' -f1,2)
        arduino-cli core install $CORE --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json,https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
        
    - name: Install libraries
      run: |
        arduino-cli lib install "TinyGPSPlus"
        arduino-cli lib install "MPU6050"
    
    - name: Compile sketch
      run: |
        arduino-cli compile --fqbn ${{ matrix.board }} --output-dir ${{ matrix.sketch }}build ${{ matrix.sketch }}
    
    - name: Set safe board name
      run: |
        BOARD_SAFE="${{ matrix.board }}"
        echo "BOARD_SAFE=${BOARD_SAFE//:/_}" >> $GITHUB_ENV
        SKETCH_SAFE=$(basename ${{ matrix.sketch }})
        echo "SKETCH_SAFE=${SKETCH_SAFE}" >> $GITHUB_ENV

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ env.BOARD_SAFE }}-${{ env.SKETCH_SAFE }}-${{ github.sha }}
        path: |
          ${{ matrix.sketch }}build/**/*.bin
          ${{ matrix.sketch }}build/**/*.hex

  documentation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install documentation tools
      run: |
        pip install mkdocs mkdocs-material
        sudo apt-get install -y doxygen
    
    - name: Generate documentation
      run: |
        # Generate API docs from source code
        doxygen docs/Doxyfile
        # Build documentation site
        mkdocs build
    
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Run security scan
      run: |
        # Check for hardcoded secrets
        find src -name "*.ino" -o -name "*.h" | xargs grep -l "password\|secret\|key" || true
        
        # Check for vulnerable dependencies
        pip install safety
        safety check --json || true

  release:
    runs-on: ubuntu-latest
    needs: [build, test, documentation]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        name: DrishtiGuide ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          ./artifacts/**/*.bin
          ./artifacts/**/*.hex